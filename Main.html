<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
  color: white;
  min-height: 100vh;
}

/* HEADER */
header {
  padding: 15px 40px;
  background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(255,255,255,0.1);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
}

header > div:first-child {
  font-size: 32px;
  font-weight: 700;
  letter-spacing: 2px;
  background: linear-gradient(135deg, #e50914, #f0631f);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.search-box {
  padding: 10px 20px;
  width: 280px;
  border-radius: 25px;
  border: 1px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.1);
  color: white;
  font-size: 14px;
  outline: none;
  backdrop-filter: blur(10px);
  transition: all 0.3s ease;
}

.search-box::placeholder {
  color: rgba(255,255,255,0.6);
}

.search-box:focus {
  background: rgba(255,255,255,0.15);
  border-color: rgba(255,255,255,0.4);
  box-shadow: 0 0 20px rgba(229, 9, 20, 0.3);
}

/* SECTIONS */
.section {
  margin: 50px 40px;
}

.section h2 {
  margin: 0 0 25px 0;
  font-size: 28px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #fff;
  border-left: 4px solid #e50914;
  padding-left: 15px;
  position: relative;
}

.section h2::after {
  content: '';
  position: absolute;
  left: 0;
  bottom: -10px;
  width: 60px;
  height: 3px;
  background: linear-gradient(90deg, #e50914, transparent);
}

.movie-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 24px;
  padding: 10px;
}

/* MOVIE CARD */
.movie-card {
  position: relative;
  border-radius: 8px;
  overflow: hidden;
  background: #1a1f3a;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
  height: 100%;
  display: flex;
  flex-direction: column;
}

.movie-card:hover {
  transform: translateY(-8px) scale(1.05);
  box-shadow: 0 12px 30px rgba(229, 9, 20, 0.4);
}

.movie-card img {
  width: 100%;
  height: 240px;
  object-fit: cover;
  transition: all 0.3s ease;
}

.movie-card:hover img {
  filter: brightness(0.7);
}

.movie-info {
  padding: 12px;
  flex-grow: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  background: linear-gradient(180deg, rgba(0,0,0,0.3), rgba(0,0,0,0.6));
}

.movie-card h3 {
  margin: 0;
  font-size: 14px;
  font-weight: 600;
  text-align: center;
  color: #fff;
  line-height: 1.4;
  min-height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Play button on hover */
.movie-card::before {
  content: '▶';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  font-size: 40px;
  color: #e50914;
  opacity: 0;
  transition: all 0.3s ease;
  z-index: 10;
  text-shadow: 0 0 20px rgba(229, 9, 20, 0.6);
}

.movie-card:hover::before {
  transform: translate(-50%, -50%) scale(1);
  opacity: 1;
}

.watch-btn {
  margin-top: auto;
  padding: 8px 16px;
  border-radius: 4px;
  border: none;
  background: linear-gradient(135deg, #e50914, #f0631f);
  color: white;
  font-weight: 600;
  cursor: pointer;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  transition: all 0.3s ease;
  width: 100%;
}

.watch-btn:hover {
  background: linear-gradient(135deg, #f0631f, #e50914);
  transform: scale(1.02);
  box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
}

/* MODAL PLAYER */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.98);
  justify-content: center;
  align-items: center;
  z-index: 1000;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

.modal iframe {
  width: 90%;
  height: 80%;
  border-radius: 8px;
  border: none;
  box-shadow: 0 0 50px rgba(229, 9, 20, 0.3);
}

.close-btn {
  position: absolute;
  top: 30px;
  right: 40px;
  font-size: 40px;
  cursor: pointer;
  color: #fff;
  transition: all 0.3s ease;
  width: 50px;
  height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(10px);
}

.close-btn:hover {
  background: rgba(229, 9, 20, 0.8);
  transform: rotate(90deg) scale(1.1);
}

/* MOBILE */
@media(max-width: 768px) {
  header {
    flex-direction: column;
    gap: 15px;
    padding: 15px 20px;
  }

  .search-box {
    width: 100%;
  }

  .section {
    margin: 30px 20px;
  }

  .section h2 {
    font-size: 22px;
  }

  .movie-grid {
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 16px;
  }

  .movie-card img {
    height: 200px;
  }

  .modal iframe {
    width: 95%;
    height: 70%;
  }
}

.glass-request-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;

  padding: 12px 20px;
  border-radius: 50px;

  background: rgba(30, 30, 30, 0.15);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);

  color: #ffffff;
  font-family: Arial, sans-serif;
  font-size: 14px;
  text-decoration: none;

  border: 1px solid rgba(255, 255, 255, 0.3);
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);

  transition: all 0.25s ease;
  z-index: 9999;
}


.glass-request-btn:hover {
  background: rgba(255, 255, 255, 0.25);
  transform: scale(1.08);
}

/* TV SHOW DROPDOWN */
.movie-card select {
  width: 85%;
  margin: 12px auto;
  padding: 8px 12px;
  border-radius: 4px;
  border: 1px solid rgba(255,255,255,0.3);
  background: linear-gradient(135deg, #e50914, #f0631f);
  color: white;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  outline: none;
  transition: all 0.25s ease;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.movie-card select:hover {
  background: linear-gradient(135deg, #f0631f, #e50914);
  box-shadow: 0 4px 12px rgba(229, 9, 20, 0.4);
  transform: scale(1.02);
}

.movie-card select:focus {
  border: 1px solid #e50914;
  background: linear-gradient(135deg, #e50914, #f0631f);
  box-shadow: 0 0 15px rgba(229, 9, 20, 0.5);
}

.movie-card select option {
  color: white;
  background: #1a1f3a;
}
</style>

const content = document.getElementById("content");

function loadMovies() {
  content.innerHTML = "";

  const categories = [...new Set(movies.map(m => m.category))];

  categories.forEach(cat => {
    const section = document.createElement("div");
    section.className = "section";
    section.innerHTML = `<h2>${cat}</h2><div class="movie-grid"></div>`;
    content.appendChild(section);

    const grid = section.querySelector(".movie-grid");

    movies
      .filter(m => m.category === cat)
      .forEach(m => {
        const card = document.createElement("div");
        card.className = "movie-card";

        let controls = "";

        // If TV Show with episodes
        if (m.episodes) {
          controls = `
            <select onchange="handleEpisodeSelect(this)">
              <option value="">Select Episode</option>
              ${m.episodes.map(ep =>
                `<option value="${ep.link}">${ep.name}</option>`
              ).join("")}
            </select>
          `;
        }
        // Regular movie
        else {
          controls = `
            <button class="watch-btn" onclick="openVideo('${m.link}')">
              Watch
            </button>
          `;
        }

        card.innerHTML = `
          <img src="${m.poster}">
          <div class="movie-info">
            <h3>${m.title}</h3>
            ${controls}
          </div>
        `;

        grid.appendChild(card);
      });
  });
}

function handleEpisodeSelect(selectElement) {
  const link = selectElement.value;
  if (link) {
    openVideo(link);
    selectElement.selectedIndex = 0; // reset dropdown
  }
}

function openVideo(link) {
  document.getElementById("videoFrame").src = link;
  document.getElementById("videoModal").style.display = "flex";
}

function closeVideo() {
  document.getElementById("videoFrame").src = "";
  document.getElementById("videoModal").style.display = "none";
}

function searchMovies() {
  let input = document.querySelector(".search-box").value.toLowerCase();

  document.querySelectorAll(".movie-card").forEach(card => {
    card.style.display =
      card.innerText.toLowerCase().includes(input)
        ? "block"
        : "none";
  });
}

loadMovies();

</script>
